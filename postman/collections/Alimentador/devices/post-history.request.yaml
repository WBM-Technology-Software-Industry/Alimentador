$kind: http-request
name: POST History (Manual)
method: POST
url: "{{base_url}}/api/devices/{{device_id}}/history"
headers:
  - key: Authorization
    value: "Bearer {{token}}"
  - key: Content-Type
    value: application/json
body:
  mode: raw
  raw: |
    {
      "grams": 120,
      "source": "manual"
    }
  options:
    raw:
      language: json
