spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/feeder}
    username: ${DATABASE_USER:feeder}
    password: ${DATABASE_PASSWORD:feeder}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

mqtt:
  broker-url: ${MQTT_BROKER_URL:ws://52.67.133.240:9001}
  username:   ${MQTT_USERNAME:}
  password:   ${MQTT_PASSWORD:}
  devices: ${MQTT_DEVICES:ALIMENTADOR_1,ALIMENTADOR_2,ALIMENTADOR_3}

server:
  port: ${PORT:8080}

logging:
  level:
    com.wbm.feeder: INFO
